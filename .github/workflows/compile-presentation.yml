name: deploy-presentation

# Only run this when the main branch changes
on:
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      refresh_website:
        type: boolean
        description: 'Refresh the website'
        default: true

# One publication at a time: GitHub Pages refuses overlapping deployments.
# A newer push waits for the running one, and replaces any older waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

# This job installs dependencies, renders the slides, and publishes them to GitHub Pages
jobs:

  compile-quarto:
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.6.1'
        use-public-rspm: true

    # Same script as on posit.cloud and in the Dockerfile
    # renv.lock has the versions; libraries.R installs them
    - name: Install R Dependencies
      run: Rscript libraries.R

    - name: Render Presentation
      env:
        QUARTO_PRINT_STACK: true
      run: |
        bash presentation/render_presentation.sh
    - name: Upload HTML Artifact
      uses: actions/upload-artifact@v4
      with:
          name: artifact-html
          path: presentation/_html
          retention-days: 1

    # the companion article (handout)
    - name: Render Article
      run: bash run.sh
    - name: Upload Article Artifact
      uses: actions/upload-artifact@v4
      with:
          name: artifact-article
          path: _html
          retention-days: 1

  # make a PDF out of it
  create-pdf:
    needs: compile-quarto
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download quarto artifact
      uses: actions/download-artifact@v4
      with:
        name: artifact-html
        path: _html
    - name: Check permissions
      run: |
        chmod -R a+rwX _html

    - name: Create PDF
      run: |
        docker run --rm -v ${{ github.workspace }}/_html:/slides astefanutti/decktape \
          --chrome-arg=--no-sandbox --chrome-arg=--disable-gpu --size 1280x720 \
          /slides/index.html /slides/index.pdf

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-presentation-pdf
        path: _html/index.pdf

  deploy-all:
    runs-on: ubuntu-latest
    needs:
      - compile-quarto
      - create-pdf
    if: ${{ github.event.inputs.refresh_website == 'true' || github.event_name == 'push' }}
    steps:
    # Pull down all artifacts
    - name: Download HTML Artifacts
      uses: actions/download-artifact@v4
      with:
            path: .
            pattern: artifact-html
    - name: Download Article
      uses: actions/download-artifact@v4
      with:
            path: .
            pattern: artifact-article
    - name: Download Pres PDF
      uses: actions/download-artifact@v4
      with:
            path: .
            pattern: artifact-presentation-pdf
    - name: Move stuff
      run: |
          set -ev
          ls -lR
          mv artifact-html website
          mv artifact-presentation-pdf/index.pdf website/presentation.pdf
          mv artifact-article website/article
    - name: prepare GitHub Pages action
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./website

  publish:
    needs: deploy-all
    if: ${{ github.event.inputs.refresh_website == 'true' || github.event_name == 'push' }}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
