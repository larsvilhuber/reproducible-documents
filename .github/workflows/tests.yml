name: tests

# Tests of the examples and the slides. They do not hold up publication
# (see compile-presentation.yml): a failure here is a bug to fix.
on:
  push:
    branches:
    - main
  workflow_dispatch:

# a new push cancels the tests of the previous one, if they are still running
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Part 1 must work for participants: render it in all formats
  test-quarto:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.6.1'
        use-public-rspm: true
    - name: Install R Dependencies
      run: Rscript libraries.R
    - name: Test example 1 (HTML, Word, PDF)
      run: |
        cd examples/01-quarto-posit-cloud
        quarto render report.qmd
        ls -l report.html report.docx report.pdf

  # every slide must fit on the page: nothing cut off, no scrolling code
  test-slides-fit:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.6.1'
        use-public-rspm: true
    - name: Install R Dependencies
      run: Rscript libraries.R
    - name: Render Presentation
      run: bash presentation/render_presentation.sh
    - name: Check that every slide fits
      run: |
        chmod -R a+rwX presentation/_html
        docker run --rm -v ${{ github.workspace }}/presentation/_html:/slides -v ${{ github.workspace }}/tests:/tests \
          --entrypoint node astefanutti/decktape /tests/check-overflow.mjs /slides/index.html

  # parts 2-4 must work for participants, on every Stata version they may
  # have (tests/stata-versions.txt); needs the STATA_LIC_BASE64 secret
  stata-versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: List the Stata versions
      id: list
      run: |
        echo "versions=$(grep -v '^#' tests/stata-versions.txt | awk 'NF { print $1 }' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  test-stata:
    needs: stata-versions
    name: test-stata (${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.stata-versions.outputs.versions) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Stata license
      id: license
      env:
        STATA_LIC_BASE64: ${{ secrets.STATA_LIC_BASE64 }}
      run: bash tests/ci-license.sh
    - name: Test parts 2, 3, 4 on Stata ${{ matrix.version }}
      if: steps.license.outputs.available == 'true'
      run: STATALIC="$RUNNER_TEMP/stata.lic" bash tests/test-stata.sh ${{ matrix.version }}
    - name: Remove the license
      if: always()
      run: rm -f "$RUNNER_TEMP/stata.lic"

  # part 4 end to end: the Colab notebook with the new cells, through PyStata
  test-colab-notebook:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Stata license
      id: license
      env:
        STATA_LIC_BASE64: ${{ secrets.STATA_LIC_BASE64 }}
      run: bash tests/ci-license.sh
    - name: Test the Colab notebook with the new cells (PyStata)
      if: steps.license.outputs.available == 'true'
      run: STATALIC="$RUNNER_TEMP/stata.lic" bash tests/test-colab-notebook.sh
    - name: Remove the license
      if: always()
      run: rm -f "$RUNNER_TEMP/stata.lic"
